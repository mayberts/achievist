<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Achievist-db logo">
  <defs>
    <linearGradient id="bg-db" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132420"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6be3ac"/>
      <stop offset="1" stop-color="#3ecf8e"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg-db)"/>
  <rect x="4" y="4" width="504" height="504" rx="100" fill="none" stroke="#1f3a30" stroke-width="4"/>

  <!-- database cylinder (lucide database glyph, scaled up) — the data layer -->
  <g transform="translate(90,150) scale(15.5)" fill="none" stroke="url(#cyl)"
     stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5" rx="9" ry="3"/>
    <path d="M3 5V19A9 3 0 0 0 21 19V5"/>
    <path d="M3 12A9 3 0 0 0 21 12"/>
  </g>

  <!-- small trophy badge, ties it back to the Achievist family -->
  <circle cx="374" cy="150" r="58" fill="#0e121b" stroke="#232c42" stroke-width="4"/>
  <g transform="translate(345,121) scale(1.55)" fill="none" stroke="#5b8cff"
     stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
    <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
    <path d="M4 22h16"/>
    <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
    <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
    <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
  </g>
</svg>
