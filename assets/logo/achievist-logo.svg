<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Achievist logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161d2e"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="trophy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb0ff"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="100" fill="none" stroke="#232c42" stroke-width="4"/>

  <!-- five-point star accent -->
  <polygon points="256,54 269,90 307,90 276,113 288,150 256,128 224,150 236,113 205,90 243,90"
           fill="#f0b429"/>

  <!-- trophy mark (lucide trophy glyph, scaled up) -->
  <g transform="translate(95,150) scale(13.5)" fill="none" stroke="url(#trophy)"
     stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
    <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
    <path d="M4 22h16"/>
    <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
    <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
    <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="440" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-weight="800" font-size="64" letter-spacing="-1" fill="#f1f4fa">Achievist</text>
</svg>
