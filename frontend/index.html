<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the standalone app can paint under the notch;
         the safe-area insets in index.css keep content out from under it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Achievist</title>

    <!-- Installable on a phone: manifest + icons for Android, the apple-*
         tags for iOS, which ignores the manifest entirely. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0d14" />
    <meta name="description" content="Your family's game achievements in one place." />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Achievist" />
